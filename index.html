<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>番茄钟 · 像素蛋</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --accent: #f472b6;
      --text: #e2e8f0;
      --pixel: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(244, 114, 182, 0.15), transparent 35%),
        radial-gradient(circle at 80% 10%, rgba(94, 234, 212, 0.12), transparent 30%),
        radial-gradient(circle at 40% 80%, rgba(94, 234, 212, 0.18), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.1);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      width: min(560px, 100%);
      padding: 28px 24px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-size: 1.8rem;
      color: #f8fafc;
    }

    p.subtitle {
      margin: 0 0 24px;
      opacity: 0.8;
      font-size: 0.95rem;
    }

    .timer {
      font-size: clamp(2rem, 5vw, 3rem);
      font-variant-numeric: tabular-nums;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .scene {
      position: relative;
      margin: 0 auto 14px;
      width: 220px;
      height: 260px;
      display: grid;
      place-items: center;
    }

    /* Pixel egg using SVG for crisp edges */
    .egg-shell {
      width: 120px;
      height: 150px;
      image-rendering: pixelated;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.35));
      transition: transform 0.4s ease, opacity 0.3s ease;
    }

    .egg-shell.wiggle {
      animation: wiggle 1.6s ease-in-out infinite;
      transform-origin: 50% 80%;
    }

    @keyframes wiggle {
      0% { transform: rotate(0deg) translateX(0px); }
      20% { transform: rotate(-2deg) translateX(-2px); }
      40% { transform: rotate(2.5deg) translateX(2px); }
      60% { transform: rotate(-1.5deg) translateX(-1px); }
      80% { transform: rotate(1.8deg) translateX(1px); }
      100% { transform: rotate(0deg) translateX(0px); }
    }

    .status-text {
      min-height: 28px;
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, #f472b6, #6366f1);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.2s ease;
      font-size: 0.98rem;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 36px rgba(244, 114, 182, 0.35);
      filter: brightness(1.05);
    }

    button:active {
      transform: translateY(1px) scale(0.99);
    }

    button.secondary {
      background: rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      box-shadow: none;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }

    .emoji-display {
      font-size: 2.4rem;
      margin-top: 8px;
      height: 44px;
      display: grid;
      place-items: center;
    }

    canvas#fireworks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(79, 70, 229, 0.15);
      color: #c7d2fe;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    .badge span {
      color: #fef9c3;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <canvas id="fireworks"></canvas>
    <div class="badge">🍅 番茄钟 · <span>25:00</span></div>
    <h1>像素蛋番茄钟</h1>
    <p class="subtitle">25 分钟专注，蛋会陪你轻轻摇晃。时间到后会收到一张随机小动物的惊喜卡片！</p>
    <div class="scene">
      <svg id="egg" class="egg-shell" viewBox="0 0 16 20" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <rect width="16" height="20" fill="none" />
        <rect x="6" y="1" width="4" height="1" fill="#f8fafc" />
        <rect x="5" y="2" width="6" height="1" fill="#e2e8f0" />
        <rect x="4" y="3" width="8" height="1" fill="#e2e8f0" />
        <rect x="4" y="4" width="8" height="1" fill="#e2e8f0" />
        <rect x="3" y="5" width="10" height="1" fill="#e2e8f0" />
        <rect x="3" y="6" width="10" height="1" fill="#e2e8f0" />
        <rect x="3" y="7" width="10" height="1" fill="#e2e8f0" />
        <rect x="3" y="8" width="10" height="1" fill="#e2e8f0" />
        <rect x="3" y="9" width="10" height="1" fill="#e2e8f0" />
        <rect x="3" y="10" width="10" height="1" fill="#e2e8f0" />
        <rect x="4" y="11" width="8" height="1" fill="#e2e8f0" />
        <rect x="4" y="12" width="8" height="1" fill="#e2e8f0" />
        <rect x="4" y="13" width="8" height="1" fill="#e2e8f0" />
        <rect x="5" y="14" width="6" height="1" fill="#e2e8f0" />
        <rect x="6" y="15" width="4" height="1" fill="#e2e8f0" />
        <rect x="6" y="16" width="4" height="1" fill="#e2e8f0" />
        <rect x="7" y="17" width="2" height="1" fill="#e2e8f0" />
        <rect x="7" y="18" width="2" height="1" fill="#e2e8f0" />
        <rect x="7" y="19" width="2" height="1" fill="#cbd5e1" />
      </svg>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="status-text" id="status">等待开始</div>
    <div class="emoji-display" id="emoji"></div>
    <div class="controls">
      <button id="startBtn">▶ 开始</button>
      <button id="stopBtn" class="secondary">■ 停止</button>
    </div>
  </div>

  <script>
    const TOTAL_SECONDS = 25 * 60;
    const animals = ['🐱', '🐶', '🦊', '🐰', '🐧', '🐻', '🦉', '🦄', '🐼', '🐨'];

    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    const emojiEl = document.getElementById('emoji');
    const eggEl = document.getElementById('egg');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    const card = document.getElementById('card');

    let remaining = TOTAL_SECONDS;
    let timerId = null;
    let running = false;
    let fireworksActive = false;
    let particles = [];

    function formatTime(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateTimerDisplay() {
      timerEl.textContent = formatTime(remaining);
    }

    function resetVisuals() {
      emojiEl.textContent = '';
      statusEl.textContent = '专注倒计时就绪';
      card.classList.remove('done');
      stopFireworks();
    }

    function startCountdown() {
      if (running) return;
      if (remaining <= 0) {
        remaining = TOTAL_SECONDS;
      }
      resetVisuals();
      running = true;
      eggEl.classList.add('wiggle');
      statusEl.textContent = '倒计时进行中...';
      timerId = setInterval(() => {
        remaining -= 1;
        updateTimerDisplay();
        if (remaining <= 0) {
          finishCountdown();
        }
      }, 1000);
    }

    function stopCountdown() {
      clearInterval(timerId);
      running = false;
      eggEl.classList.remove('wiggle');
      statusEl.textContent = '哦不，蛋裂开了！';
      emojiEl.textContent = '🥚💥';
      stopFireworks();
    }

    function finishCountdown() {
      clearInterval(timerId);
      running = false;
      remaining = 0;
      updateTimerDisplay();
      eggEl.classList.remove('wiggle');
      const animal = animals[Math.floor(Math.random() * animals.length)];
      emojiEl.textContent = animal;
      statusEl.textContent = '做得好！休息一下吧';
      launchFireworks();
    }

    function resizeCanvas() {
      canvas.width = card.clientWidth;
      canvas.height = card.clientHeight;
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.speed = Math.random() * 2 + 2;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.01 + 0.015;
        this.color = color;
        this.size = Math.random() * 2 + 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.015;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function spawnBurst() {
      const colors = ['#f472b6', '#60a5fa', '#fbbf24', '#a78bfa', '#34d399'];
      const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
      const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
      const burstColor = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 50; i++) {
        particles.push(new Particle(x, y, burstColor));
      }
    }

    function animateFireworks() {
      if (!fireworksActive) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (Math.random() < 0.08) {
        spawnBurst();
      }
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateFireworks);
    }

    function launchFireworks() {
      resizeCanvas();
      particles = [];
      fireworksActive = true;
      animateFireworks();
      setTimeout(() => {
        fireworksActive = false;
        setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 400);
      }, 5000);
    }

    function stopFireworks() {
      fireworksActive = false;
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    startBtn.addEventListener('click', startCountdown);
    stopBtn.addEventListener('click', () => {
      stopCountdown();
      remaining = TOTAL_SECONDS;
      updateTimerDisplay();
    });

    window.addEventListener('resize', resizeCanvas);

    updateTimerDisplay();
    resizeCanvas();
  </script>
</body>
</html>
